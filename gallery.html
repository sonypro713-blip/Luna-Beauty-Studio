
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery | Luna Beauty Studio</title>

  <meta
    name="description"
    content="Explore the beauty treatments, salon atmosphere, and services at Luna Beauty Studio."
  >

  <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main>

    <!-- Gallery Hero -->
    <section class="page-hero gallery-hero">
      <div class="gallery-hero-content">
        <p class="eyebrow">OUR GALLERY</p>
        <h1>A glimpse of Luna.</h1>
        <p>Beauty, details, and moments of care.</p>
      </div>
    </section>

    <!-- Gallery Images -->
    <section class="gallery-section">

      <div class="gallery-grid">

        <img
          src="images/Img1.png"
          alt="Hair coloring and balayage treatment"
          loading="lazy"
        >

        <img
          src="images/Img2.png"
          alt="Professional hair styling"
          loading="lazy"
        >

        <img
          src="images/Img3.png"
          alt="Relaxing facial treatment"
          loading="lazy"
        >

        <img
          src="images/Img4.png"
          alt="Professional facial cleansing treatment"
          loading="lazy"
        >

        <img
          src="images/Img5.png"
          alt="Beautiful manicure treatment"
          loading="lazy"
        >

        <img
          src="images/Img6.png"
          alt="Relaxing pedicure treatment"
          loading="lazy"
        >

      </div>

    </section>

    <!-- Booking CTA -->
    <section class="service-booking">
      <h2>Ready for Your Moment?</h2>
      <p>
        We'd love to welcome you to Luna Beauty Studio.
        Get in touch and book your next beauty appointment.
      </p>
      <a href="contact.html" class="btn">
        Book Your Appointment
      </a>
    </section>

  </main>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/main.js?v=5"></script>

</body>
</html>
